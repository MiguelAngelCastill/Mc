<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCveiculos</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:black;color:white;overflow-x:hidden}

/* HEADER */
header{
display:flex;justify-content:space-between;
padding:20px;position:fixed;width:100%;
background:rgba(0,0,0,0.7);z-index:1000;
}

nav a, nav button{
margin-left:15px;color:white;text-decoration:none;
background:none;border:none;cursor:pointer;
}

/* HERO */
.hero{
height:100vh;
background:url('https://images.unsplash.com/photo-1552519507-da3b142c6e3d') center/cover;
display:flex;flex-direction:column;
justify-content:center;align-items:center;
text-align:center;
animation:fade 2s;
}

.hero h2{font-size:50px}

/* VEHICULOS */
.vehicles{
padding:120px 20px;
display:flex;flex-wrap:wrap;
justify-content:center;gap:20px;
}

.car{
width:300px;background:#111;border-radius:10px;
overflow:hidden;transition:.3s;
}

.car img{width:100%;height:200px;object-fit:cover;}

.car:hover{transform:scale(1.05)}

.car-content{padding:15px;text-align:center}

button.buy{
margin-top:10px;padding:10px;
background:white;color:black;border:none;
cursor:pointer;width:100%;
}

/* CARRITO */
.cart{
position:fixed;right:-300px;top:0;
width:300px;height:100%;
background:#111;padding:20px;
transition:.3s;
}
.cart.active{right:0}

/* LOGIN */
.login{
position:fixed;top:50%;left:50%;
transform:translate(-50%,-50%);
background:#111;padding:20px;
display:none;
}

.login input{
display:block;margin:10px 0;
padding:10px;width:100%;
}

/* ANIMACION */
@keyframes fade{from{opacity:0}to{opacity:1}}

</style>
</head>

<body>

<header>
<h1>MCveiculos</h1>
<nav>
<a href="#">Inicio</a>
<a href="#">Vehículos</a>
<button onclick="showLogin()">Login</button>
<button onclick="toggleCart()">🛒</button>
</nav>
</header>

<!-- HERO -->
<section class="hero">
<h2>Conduce el futuro</h2>
<p>Vehículos eléctricos premium</p>
</section>

<!-- VEHICULOS PREMIUM -->
<section class="vehicles">

<div class="car">
<img src="https://images.unsplash.com/photo-1549924231-f129b911e442">
<div class="car-content">
<h3>MC City E1</h3>
<p>$25,000</p>
<button class="buy" onclick="addToCart('City E1',25000)">Comprar</button>
</div>
</div>

<div class="car">
<img src="https://images.unsplash.com/photo-1619767886558-efdc7b9e0473">
<div class="car-content">
<h3>MC SUV E-X</h3>
<p>$40,000</p>
<button class="buy" onclick="addToCart('SUV E-X',40000)">Comprar</button>
</div>
</div>

<div class="car">
<img src="https://images.unsplash.com/photo-1511391409280-0a6c03f3b4f1">
<div class="car-content">
<h3>MC Sport E-Pro</h3>
<p>$60,000</p>
<button class="buy" onclick="addToCart('Sport E-Pro',60000)">Comprar</button>
</div>
</div>

</section>

<!-- CARRITO -->
<div id="cart" class="cart">
<h2>Carrito</h2>
<ul id="items"></ul>
<p id="total"></p>
<button onclick="pay()">Pagar</button>
</div>

<!-- LOGIN -->
<div id="login" class="login">
<h2>Login</h2>
<input type="text" placeholder="Usuario">
<input type="password" placeholder="Contraseña">
<button onclick="login()">Entrar</button>
</div>

<!-- MUSICA -->
<audio autoplay loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_5d4a4c82bb.mp3">
</audio>

<script>
let cart=[];
let total=0;

/* CARRITO */
function addToCart(name,price){
cart.push({name,price});
total+=price;
updateCart();
}

function updateCart(){
let list=document.getElementById("items");
list.innerHTML="";
cart.forEach(i=>{
let li=document.createElement("li");
li.textContent=i.name+" - $"+i.price;
list.appendChild(li);
});
document.getElementById("total").textContent="Total: $"+total;
}

function toggleCart(){
document.getElementById("cart").classList.toggle("active");
}

/* LOGIN */
function showLogin(){
document.getElementById("login").style.display="block";
}

function login(){
alert("Login exitoso 🔐");
document.getElementById("login").style.display="none";
}

/* PAGO */
function pay(){
if(cart.length===0){
alert("Carrito vacío");
return;
}
alert("Pago realizado con éxito 💳");
cart=[];total=0;
updateCart();
}
</script>

</body>
</html>
